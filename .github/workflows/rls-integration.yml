name: RLS Integration

# Authorization tests against a REAL Postgres with RLS enforced.
#
# The main unit suite mocks the Supabase client, so it cannot observe a policy at
# all — a mocked call returns whatever the mock says regardless of what the
# database would have allowed. These tests sign in as actual seeded users and let
# Postgres decide, which is the only way an RLS regression is visible.
#
# The runner brings up a full local Supabase stack from supabase/migrations, so
# this also continuously proves the baseline still rebuilds from empty.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/lints/**'
      - 'scripts/db-advisors.mjs'
      - 'tests/integration/**'
      - 'vitest.integration.config.mts'
      - '.github/workflows/rls-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/lints/**'
      - 'scripts/db-advisors.mjs'
      - 'tests/integration/**'
      - 'vitest.integration.config.mts'
      - '.github/workflows/rls-integration.yml'

concurrency:
  group: rls-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  rls:
    name: RLS & tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies supabase/migrations to an empty database. If the baseline ever
      # stops rebuilding from scratch, this step fails and the cause is obvious.
      - name: Start local Supabase stack
        run: supabase start

      - name: Export stack credentials
        run: |
          supabase status -o env | sed -E 's/^API_URL=/SUPABASE_TEST_URL=/;
                                           s/^ANON_KEY=/SUPABASE_TEST_ANON_KEY=/;
                                           s/^SERVICE_ROLE_KEY=/SUPABASE_TEST_SERVICE_ROLE_KEY=/;
                                           s/^DB_URL=/SUPABASE_TEST_DB_URL=/' \
            | grep -E '^SUPABASE_TEST_' | tr -d '"' >> "$GITHUB_ENV"

      # Supabase's own advisors, run against the database these migrations just
      # built. The hosted dashboard has no way to dismiss a finding, and most of
      # ours are correct by design and will never clear, so a permanently red
      # dashboard is one nobody reads. The gate lives here instead: everything
      # currently accepted is listed with a reason in
      # supabase/lints/advisor-exceptions.json, and anything new fails.
      # Static check, no database needed, so it runs before the slow steps.
      # Every mutating API route must declare allowedRoles, use a public or
      # api-key handler, or carry an explicit `// route-guard:` opt-out. Two real
      # vulnerabilities in one week came from routes where authorization was
      # invisible when reading the code.
      - name: API route guards
        run: npm run check:route-guards

      - name: Database advisors
        run: npm run db:advisors -- --db-url "$SUPABASE_TEST_DB_URL"

      # The API tests drive real HTTP, so the app has to be running. It must be a
      # production build: `next dev` 308-redirects every /api route to a trailing
      # slash and then 500s, which never happens in a built app or on production.
      - name: Build the app against the local stack
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build

      - name: Start the app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: |
          npm start > "$RUNNER_TEMP/app.log" 2>&1 &
          echo "APP_TEST_URL=http://localhost:3000" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: npm run test:integration

      - name: App log on failure
        if: failure()
        run: tail -100 "$RUNNER_TEMP/app.log" || true

      - name: Stop stack
        if: always()
        run: supabase stop --no-backup
